openapi: 3.1.0
info:
  title: HR & Biometric Management Microservice
  version: 1.0.0
  description: Handles employee lifecycle status and biometric device associations.
paths:
  /api/v1/hr/employees/{employeeId}/status:
    post:
      summary: Update employee active status
      operationId: updateEmployeeStatus
      x-agentsaga-action-type: compensatable
      x-agentsaga-risk-level: medium
      x-agentsaga-compensating-action:
        path: /api/v1/hr/employees/{employeeId}/status
        method: POST
        mapping:
          employeeId: "$.request.path.employeeId"
          status: "ACTIVE"
          reason: "Automated SAGA rollback due to downstream workflow abort"
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
            pattern: "^EMP-[0-9]{5}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE, SUSPENDED, TERMINATED]
                reason:
                  type: string
                  minLength: 5
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  employeeId:
                    type: string
                  previousStatus:
                    type: string
                  currentStatus:
                    type: string
                  updatedAt:
                    type: string
                    format: date-time
