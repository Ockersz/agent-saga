services:
  postgres:
    image: postgres:16-alpine
    container_name: agentsaga-postgres
    environment:
      POSTGRES_USER: saga_admin
      POSTGRES_PASSWORD: saga_secure_password
      POSTGRES_DB: agentsaga_journal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./gateway/src/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga_admin -d agentsaga_journal"]
      interval: 5s
      timeout: 5s
      retries: 5

  enterprise-services:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: agentsaga-services
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:3000/api/v1/state || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: agentsaga-gateway
    environment:
      PORT: 8080
      DATABASE_URL: postgres://saga_admin:saga_secure_password@postgres:5432/agentsaga_journal
      UPSTREAM_SERVICES_URL: http://enterprise-services:3000
    ports:
      - "8080:8080"
    volumes:
      - ./contracts:/app/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
      enterprise-services:
        condition: service_healthy

volumes:
  pgdata:
