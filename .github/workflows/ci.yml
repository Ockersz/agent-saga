name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gateway-test:
    name: Gateway Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json

      - name: Install Gateway Dependencies
        run: |
          cd gateway
          npm ci

      - name: Run Gateway Unit & SAGA Tests
        run: |
          cd gateway
          npm test

      - name: Build Gateway
        run: |
          cd gateway
          npm run build

  services-build:
    name: Enterprise Mock Services Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: services/package-lock.json

      - name: Install Services Dependencies
        run: |
          cd services
          npm ci

      - name: Build Services Mesh
        run: |
          cd services
          npm run build

  benchmark-eval:
    name: Live End-to-End HTTP Benchmark
    needs: [gateway-test, services-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Gateway & Services
        run: |
          cd gateway && npm ci && npm run build
          cd ../services && npm ci && npm run build

      - name: Install Benchmark Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r eval-harness/requirements.txt

      - name: Run Live End-to-End HTTP Benchmark (200 workflows)
        run: |
          python eval-harness/benchmark_runner.py --spawn-local --runs 200
