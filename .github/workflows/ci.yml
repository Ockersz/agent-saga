name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gateway-test:
    name: Gateway Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json

      - name: Install Gateway Dependencies
        run: |
          cd gateway
          npm ci

      - name: Run Gateway Unit & SAGA Tests
        run: |
          cd gateway
          npm test

      - name: Build Gateway
        run: |
          cd gateway
          npm run build

  services-build:
    name: Enterprise Mock Services Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: services/package-lock.json

      - name: Install Services Dependencies
        run: |
          cd services
          npm ci

      - name: Build Services Mesh
        run: |
          cd services
          npm run build

  benchmark-eval:
    name: Live HTTP & PostgreSQL 16 Benchmark
    needs: [gateway-test, services-build]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saga_admin
          POSTGRES_PASSWORD: saga_secure_password
          POSTGRES_DB: agentsaga_journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Gateway & Services
        run: |
          cd gateway && npm ci && npm run build
          cd ../services && npm ci && npm run build

      - name: Initialize PostgreSQL 16 SAGA Schema
        run: |
          node -e '
            const fs = require("fs");
            const { Pool } = require("./gateway/node_modules/pg");
            const sql = fs.readFileSync("./gateway/src/database/schema.sql", "utf8");
            const pool = new Pool({ connectionString: "postgres://saga_admin:saga_secure_password@127.0.0.1:5432/agentsaga_journal" });
            pool.query(sql).then(() => { console.log("Schema applied"); return pool.end(); }).catch(e => { console.error(e); process.exit(1); });
          '

      - name: Install Benchmark Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r eval-harness/requirements.txt

      - name: Run Live End-to-End HTTP Benchmark with PostgreSQL 16 Journal (100 workflows)
        run: |
          python eval-harness/benchmark_runner.py --spawn-local --runs 100 --database-url postgres://saga_admin:saga_secure_password@127.0.0.1:5432/agentsaga_journal

      - name: Run Concurrent Multi-Agent Isolation Benchmark (60 flows/tier)
        run: |
          python eval-harness/concurrency_benchmark.py --spawn-local --workflows-per-tier 60
